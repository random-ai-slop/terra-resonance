name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            installed: wheel
          - python: '3.13'
            installed: both
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and build dependencies
        run: python -m pip install '.[test,build]'
      - name: Ensure media tests have FFmpeg
        if: matrix.python == '3.13'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Focused scientific and workflow tests
        run: python -m pytest -q
      - name: Check canonical website assets
        if: matrix.python == '3.13'
        run: python scripts/sync_web_assets.py --check
      - name: Build wheel and source distribution
        run: python -m build --outdir dist/ci
      - name: Audit archives and exercise isolated installations
        run: python scripts/check_distribution.py --kind '${{ matrix.installed }}' --report 'dist/ci/check-python-${{ matrix.python }}.json'
      - name: Retain tested release candidates
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/ci
          if-no-files-found: error
          retention-days: 14

  web:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - name: Verify Pages does not require Sites hosting metadata
        run: |
          if [ -f .openai/hosting.json ]; then
            mv .openai/hosting.json "$RUNNER_TEMP/terra-hosting.json"
          fi
      - run: npm run build:pages
      - name: Retain static Pages output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-static
          path: apps/web/dist/pages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
