name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify version tag before running release work
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_distribution.py --metadata-only --tag "$TAG"
          python -m pip install packaging
          python - <<'PY'
          import os, tomllib
          from packaging.version import Version
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\nprerelease={str(Version(version).is_prerelease).lower()}\n')
          PY

  verify:
    needs: metadata
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - name: Verify exact tested archive checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Attach tested packages and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          # Existing releases are never silently overwritten. Failed asset uploads
          # leave an unpublished draft for inspection, not a partial public release.
          gh release create "$TAG" --repo "$GH_REPO" --verify-tag --draft \
            --generate-notes --title "$TAG" --prerelease="$PRERELEASE" \
            "dist/terra_resonance-$VERSION-py3-none-any.whl" \
            "dist/terra_resonance-$VERSION.tar.gz" dist/SHA256SUMS
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false
